<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>飲食店システム シミュレーター</title>
<style>
:root{color-scheme:light;--bg:#ebeee8;--surface:#fff;--line:#dce0d6;--ink:#1d2320;--sub:#5f675f;--accent:#466a33;--accent-hover:#3a5a2a;--ng:#a8321f;--field:#8a9286;--focus:#1f62c9;--sun:#e2a72e;
  --font:"Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.7;display:grid;place-items:center;padding:16px}
.lock{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 22px rgba(29,35,32,.11);padding:28px 24px;display:grid;gap:14px}
.lock h1{margin:0;font-size:1.3rem;line-height:1.4}
.lock h1::before{content:"";display:inline-block;width:.45em;height:.45em;border-radius:50%;background:var(--sun);margin-right:.4em;vertical-align:.15em}
.lock p{margin:0;color:var(--sub);font-size:.9rem}
label{font-size:.85rem;font-weight:700}
input{width:100%;min-height:46px;padding:8px 12px;border:1px solid var(--field);border-radius:8px;font:inherit}
button{min-height:46px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:inherit;font-weight:700;cursor:pointer}
button:hover{background:var(--accent-hover)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.err{color:var(--ng);font-size:.88rem;min-height:1.4em}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
</style>
</head>
<body>

  <div style="display:grid;gap:6px"><label for="pw">パスワード</label><input id="pw" type="password" autocomplete="current-password" required></div>
  <button type="submit" id="go">開く</button>
  <div class="err" id="err" role="alert"></div>
</form>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.d));
  return JSON.parse(await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
}
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=document.getElementById('go'),err=document.getElementById('err');
  btn.disabled=true;btn.textContent='開いています…';err.textContent='';
  try{
    const pages=await unlock(document.getElementById('pw').value);
    document.body.innerHTML='';
    const fr=document.createElement('iframe');fr.title='飲食店システム シミュレーター';document.body.append(fr);
    window.__go=(name,hash)=>{window.__hash=hash||'';fr.srcdoc=pages[name]||pages.index;};
    window.__go('index','');
  }catch(x){
    err.textContent=window.crypto&&crypto.subtle?'パスワードがちがいます。':'このブラウザでは開けません。Chrome・Edge・Safari の新しいものでお試しください。';
    btn.disabled=false;btn.textContent='開く';
  }
});
